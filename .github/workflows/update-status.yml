# Writes status.json every 15 min: a reachability probe of the Forge
# (forge.aismith.io). The retired hub's status-feed is no longer read, so its
# three signal fields are written as null. Commit only on change; this job must
# never fail hard.
name: update-status
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe + compose
        run: |
          HUB_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://forge.aismith.io/ || echo 000)
          HUB_UP=$([ "$HUB_CODE" = "200" ] && echo true || echo false)
          STATE="ok"
          [ "$HUB_UP" = "false" ] && STATE="degraded"
          jq -n --argjson hub_up "$HUB_UP" \
                --arg state "$STATE" --arg now "$(date -u +%FT%TZ)" \
            '{generated_at:$now, state:$state, hub_up:$hub_up,
              fleet_signal_age_min:null, open_monitor_alerts:null,
              backup_signal_age_min:null}' > status.json
      - name: Commit if changed (ignoring the timestamp)
        run: |
          git config user.name "aismith-status"
          git config user.email "accounts@simoneskitchen.com"
          if ! git diff --quiet -I'"generated_at"' status.json 2>/dev/null; then
            git add status.json && git commit -m "status: refresh" && git push
          else
            git checkout -- status.json 2>/dev/null || true
            echo "no material change"
          fi
      # Public changelog (updates.json, read by updates.html). DORMANT until the
      # CHANGELOG_READ_TOKEN secret is set AND CHANGELOG_SINCE holds a date:
      # without either it reads nothing and writes nothing. Opt-in: only merged
      # pull requests labelled public-changelog and not no-changelog are listed,
      # four fields each. It runs after the status commit and cannot fail the
      # job, so the status probe above behaves exactly as before.
      - name: Changelog (opt-in, dormant without its token)
        continue-on-error: true
        env:
          CHANGELOG_TOKEN: ${{ secrets.CHANGELOG_READ_TOKEN }}
          CHANGELOG_REPOS: "AISmithFactory/aismith-hub-seed AISmithFactory/aismith-packs"
          # The start date, UTC, YYYY-MM-DD: the day CHANGELOG_READ_TOKEN is first set.
          CHANGELOG_SINCE: ""
        run: python3 scripts/changelog.py updates.json
      - name: Commit updates if changed
        run: |
          if ! git diff --quiet -- updates.json; then
            git add updates.json && git commit -m "updates: refresh" && git push
          else
            echo "no new updates"
          fi
