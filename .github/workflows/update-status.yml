# Writes status.json every 15 min: a reachability probe of the Forge
# (forge.aismith.io). The retired hub's status-feed is no longer read, so its
# three signal fields are written as null. Commit only on change; this job must
# never fail hard.
name: update-status
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe + compose
        run: |
          HUB_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://forge.aismith.io/ || echo 000)
          HUB_UP=$([ "$HUB_CODE" = "200" ] && echo true || echo false)
          STATE="ok"
          [ "$HUB_UP" = "false" ] && STATE="degraded"
          jq -n --argjson hub_up "$HUB_UP" \
                --arg state "$STATE" --arg now "$(date -u +%FT%TZ)" \
            '{generated_at:$now, state:$state, hub_up:$hub_up,
              fleet_signal_age_min:null, open_monitor_alerts:null,
              backup_signal_age_min:null}' > status.json
      - name: Commit if changed (ignoring the timestamp)
        run: |
          git config user.name "aismith-status"
          git config user.email "accounts@simoneskitchen.com"
          if ! git diff --quiet -I'"generated_at"' status.json 2>/dev/null; then
            git add status.json && git commit -m "status: refresh" && git push
          else
            git checkout -- status.json 2>/dev/null || true
            echo "no material change"
          fi
